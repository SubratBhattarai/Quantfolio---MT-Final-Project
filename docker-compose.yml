# ── Quantfolio — Docker Compose ─────────────────────────────────────────────
#
#  Services:
#    backend   FastAPI + Uvicorn on port 8000 (internal), 8000 (host)
#    frontend  Nginx serving React SPA on port 80 (internal), 3000 (host)
#
#  Usage:
#    docker compose up --build          # first run / after code changes
#    docker compose up -d               # detached (background)
#    docker compose down                # stop and remove containers
#    docker compose down -v             # also remove the DB volume
#
#  Open in browser: http://localhost:3000
#  API docs:        http://localhost:8000/docs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend          # Dockerfile lives inside backend/
      dockerfile: Dockerfile
    container_name: quantfolio-backend
    restart: unless-stopped

    environment:
      # SQLite file path inside the container; persisted via the volume below.
      DB_PATH: /app/data/quantfolio.db
      PYTHONUNBUFFERED: "1"

    volumes:
      # Named volume keeps the SQLite database across container restarts.
      - quantfolio_db:/app/data

    ports:
      # Expose backend directly for API testing (Swagger UI at /docs).
      # Remove this entry in a purely internal deployment.
      - "8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - quantfolio_net

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend         # Dockerfile + nginx.conf live inside frontend/
      dockerfile: Dockerfile
    container_name: quantfolio-frontend
    restart: unless-stopped

    ports:
      # Main entry point for the browser.
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - quantfolio_net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  quantfolio_db:
    name: quantfolio_db

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  quantfolio_net:
    name: quantfolio_net
    driver: bridge
