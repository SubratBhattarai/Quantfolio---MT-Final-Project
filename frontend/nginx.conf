server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- SPA fallback -------------------------------------------------------
    # Any path that doesn't match a real file is served index.html so React
    # Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API reverse proxy --------------------------------------------------
    # Forward /api/* to the FastAPI backend container.
    # The service name "backend" comes from docker-compose.yml.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Static asset caching -----------------------------------------------
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Security headers ---------------------------------------------------
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "strict-origin" always;
}
